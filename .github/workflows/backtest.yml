name: Backtest des stratégies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/strategies.py", "bot/backtest.py", "bot/data.py"]
  schedule:
    - cron: "13 6 1 * *"   # mise à jour le 1er de chaque mois

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.backtest
      - name: Enregistrer le rapport
        run: |
          git config user.name "robot-trading"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Rapport de backtest du $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
